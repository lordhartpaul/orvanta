kind: TestCase
name: tests.SepaAtTheWeekendWaitsForMonday
description: "On a Sunday the scheme is closed: kept until Monday 07:00 Berlin time."
target: payments.flows.TransactionProcessing
clock: "2026-10-04T10:00:00Z"
given:
  txn:
    id: ORVTXN0000000008
    endToEndId: SEPA-T1
    amount: 1250
    currency: EUR
    requestedDate: "2026-10-04"
    chargeBearer: SLEV
    debtor: {name: "Rheinland Pumpen GmbH", account: "DE89370400440532013000", agentBic: DEUTDEFF}
    creditor: {name: "Atelier Lumiere SARL", account: "FR1420041010050500013M02606", agentBic: BNPAFRPP}
mocks:
  connectors.AccountLookup: {status: ACTIVE, currency: EUR}
expect:
  - result.status == 'WAREHOUSE'
  - txn.warehouse.until == '2026-10-05T05:00:00Z'
