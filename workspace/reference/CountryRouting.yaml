kind: ReferenceTable
name: reference.CountryRouting
description: >
  How a creditor account is identified in each country: IBAN, or an account number with a national bank
  code (sort code, IFSC, ABA routing number, BSB, branch code), or with a BIC. 'identifier' is what the
  country needs: IBAN | BANK_CODE | BIC. 'bankCodeName' and 'bankCodeFormat' (a regular expression) say
  what the national code is called and how it looks; 'bankCodeInIban' whether the IBAN carries it (so the two
  must agree when both are given). Written from general knowledge of the schemes, not from a licensed
  directory: compare with the bank's routing guide and add the countries you pay to.
key: country
