kind: Channel
name: channels.SbgMqInbound
description: >
  Corporate customers' ISO 20022 credit transfer initiations (pain.001) arriving on the SBG IBM MQ queue
  SBGQ1DEVH2H (host-to-host). Off until ORVANTA_SBG_MQ_ENABLED=true; the connection details are in the
  transport below and can be changed here in Studio like any model, with a second person approving.
direction: inbound
purpose: instruction
format: iso20022
messageTypes: [pain.001]
mapping: payments.inbound.Pain001ToCanonical
validation: payments.rules.InstructionValidation
statusReport: channels.SbgMqStatusOutbound
duplicates: HOLD
maxBytes: 20000000
transport:
  - type: ibmmq
    host: ${env.SBG_MQ_HOST:-10.50.1.104}
    port: ${env.SBG_MQ_PORT:-1600}
    channel: ${env.SBG_MQ_CHANNEL:-SBG609SN.CH}
    queueManager: ${env.SBG_MQ_QUEUE_MANAGER:-CMQPSB6093XDQM}
    queue: ${env.SBG_MQ_IN_QUEUE:-SBGQ1DEVH2H}
    username: ${env.SBG_MQ_USER:-sbgdev}
    # the development password of the queue manager; set SBG_MQ_PASSWORD in the environment for anything but development
    password: ${env.SBG_MQ_PASSWORD}
    waitSeconds: 5
    enabled: ${env.ORVANTA_SBG_MQ_ENABLED:-false}
