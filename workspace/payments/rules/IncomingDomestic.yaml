kind: RuleSet
name: payments.rules.IncomingDomestic
description: What a received domestic rand payment must have before the account is looked at; the codes are return reasons.
rules:
  - id: CREDITOR_ACCOUNT_PRESENT
    assert: exists(txn.creditor.account)
    code: AC01
    message: The creditor account is missing
  - id: AMOUNT_POSITIVE
    assert: exists(txn.amount) and txn.amount > 0
    code: AM02
    message: The amount is missing or not greater than zero
  - id: CURRENCY_RAND
    assert: txn.currency == 'ZAR'
    code: AM03
    message: A domestic payment is in rand
  - id: SENDER_REFERENCES_PRESENT
    assert: exists(txn.endToEndId) and exists(txn.originalTxId)
    code: FF01
    message: The end-to-end id or the transaction id of the sender is missing
