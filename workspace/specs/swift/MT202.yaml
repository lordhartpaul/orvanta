kind: MessageSpec
name: specs.swift.MT202
description: >
  Field rules of the MT202 financial institution transfer and of its cover variant (MT202 COV),
  which adds sequence B with the underlying customer credit transfer.
  Formats are in SWIFT format notation. Written from the published field formats, not copied from a
  standards release: compare with the release your bank is on before relying on it.
format: swift.mt
messageType: MT202
sequences:
  - id: A
    fields:
      - {tag: "20", name: transaction reference, required: true, format: "16x"}
      - {tag: "21", name: related reference, required: true, format: "16x"}
      - {tag: "13C", name: time indication, repeat: true, format: "/8c/4!n1!x4!n"}
      - {tag: "32A", name: value date, currency and amount, required: true, format: "6!n3!a15d", is: date}
      - {tag: "52", name: ordering institution, options: {A: ["[/1!a][/34x]", "4!a2!a2!c[3!c]"], D: ["[/1!a][/34x]", "4*35x"]}}
      - {tag: "53", name: sender's correspondent, options: {A: ["[/1!a][/34x]", "4!a2!a2!c[3!c]"], B: ["[/1!a][/34x]", "[35x]"], D: ["[/1!a][/34x]", "4*35x"]}}
      - {tag: "54", name: receiver's correspondent, options: {A: ["[/1!a][/34x]", "4!a2!a2!c[3!c]"], B: ["[/1!a][/34x]", "[35x]"], D: ["[/1!a][/34x]", "4*35x"]}}
      - {tag: "56", name: intermediary, options: {A: ["[/1!a][/34x]", "4!a2!a2!c[3!c]"], D: ["[/1!a][/34x]", "4*35x"]}}
      - {tag: "57", name: account with institution, options: {A: ["[/1!a][/34x]", "4!a2!a2!c[3!c]"], B: ["[/1!a][/34x]", "[35x]"], D: ["[/1!a][/34x]", "4*35x"]}}
      - {tag: "58", name: beneficiary institution, required: true, options: {A: ["[/1!a][/34x]", "4!a2!a2!c[3!c]"], D: ["[/1!a][/34x]", "4*35x"]}}
      - {tag: "72", name: sender to receiver information, format: "6*35x"}
  - id: B
    required: false
    fields:
      - {tag: "50", name: ordering customer, required: true, options: {A: ["[/34x]", "4!a2!a2!c[3!c]"], F: ["35x", "4*35x"], K: ["[/34x]", "4*35x"]}}
      - {tag: "52", name: ordering institution, options: {A: ["[/1!a][/34x]", "4!a2!a2!c[3!c]"], D: ["[/1!a][/34x]", "4*35x"]}}
      - {tag: "56", name: intermediary institution, options: {A: ["[/1!a][/34x]", "4!a2!a2!c[3!c]"], C: "/34x", D: ["[/1!a][/34x]", "4*35x"]}}
      - {tag: "57", name: account with institution, options: {A: ["[/1!a][/34x]", "4!a2!a2!c[3!c]"], B: ["[/1!a][/34x]", "[35x]"], C: "/34x", D: ["[/1!a][/34x]", "4*35x"]}}
      - {tag: "59", name: beneficiary customer, required: true, options: {"": ["[/34x]", "4*35x"], A: ["[/34x]", "4!a2!a2!c[3!c]"], F: ["[/34x]", "4*35x"]}}
      - {tag: "70", name: remittance information, format: "4*35x"}
      - {tag: "72", name: sender to receiver information, format: "6*35x"}
      - {tag: "33B", name: currency and instructed amount, format: "3!a15d", is: currencyAmount}
