- id: UC-67A
  area: Integration
  title: "A connector with a circuit breaker stops calling a system that keeps failing for a while, tries it once when the time is up, and closes the circuit when it answers; refusals do not count"
  tests: [java:aFailingSystemIsLeftAloneForAWhileAndTriedOnceWhenTheTimeIsUp]

- id: UC-68A
  area: Security
  title: "A model-defined API that changes data may ask for a second person: the call is recorded as a request (202) and runs as the caller once approved; reads need no approval"
  tests: [java:aModelDefinedApiThatAsksForApprovalRunsOnlyWhenASecondPersonApproves]

- id: UC-69A
  area: Transports
  title: "A partner pushes files with a key of its own, limited to its channels, which people rotate and disable in the Console without a redeployment"
  tests: [java:aPartnerPushesFilesWithItsOwnKeyWhichIsRotatedWithoutARedeployment]

- id: UC-70A
  area: Transports
  title: "A sender on a queue (RabbitMQ, Kafka, IBM MQ) gets a receipt per message stored: the id here, the outcome of reading it and the reason when refused"
  tests: [java:anInstructionArrivesOnAQueueAndItsStatusReportLeavesOnAQueue]

- id: UC-71A
  area: Transports
  title: "A partner submits messages as SOAP requests (the message in the Body, the channel's key or its own) and gets a SOAP envelope with a receipt per message, or a fault"
  tests: [java:aPartnerSubmitsAnInstructionAsASoapRequestAndGetsAReceiptEnvelope]

- id: UC-72A
  area: Integration
  title: "A connector presents our client certificate to a system that requires one (mutual TLS) and trusts that system only by the certificates named; without ours, or without trust, the call fails"
  tests: [java:aServiceThatRequiresAClientCertificateIsCalledWithOurs]

- id: UC-73A
  area: Formats
  title: "A payment file of fixed-width or delimited records is read by a Format model into an instruction and its payments, and written back the same way; a line the model does not know is refused"
  tests: [java:aFixedWidthFileIsReadByItsModelAndWrittenBackTheSame, java:aDelimitedFileIsReadAndWrittenWithQuotes, java:aFormatWithAMistakeIsAProblemOfTheModelAndAChannelNamesItsFormat,
          java:aFixedWidthPaymentFileBecomesAnInstructionAndItsPayments]

- id: UC-74A
  area: Low-code
  title: "A flow's wait step stops the payment until a callback fills the answer or a time has passed, with a retry time and its own time limit; run again with the answer there, the flow goes on"
  tests: [java:theFlowStopsUntilTheAnswerIsThereAndGoesOnWhenItIs, java:aWaitStepNeedsACodeAndSensibleTimes, model:tests.PendingFraudResultWaits,
          model:tests.ShortLiquidityWaitsAndRetries]

- id: UC-75A
  area: Low-code
  title: "A flow's task step hands a payment to people in a named operator queue with instructions; the review queue lists it under that queue, and once released the flow goes on past the task"
  tests: [java:aPaymentIsHeldForAQueueWithInstructionsAndGoesOnOnceReleased, java:aTaskStepNeedsACodeAndAQueue]

- id: UC-76A
  area: Formats
  title: "Every way a message was found to be wrong has a sample file that the engine refuses with the expected reason code: truncated or non-ISO XML, a type no channel takes, an MT message missing a mandatory field or with a malformed amount, non-message JSON, plain text, a flat file with an unknown record"
  tests: [java:everyNegativeSampleIsRefusedWithTheExpectedReason]

- id: UC-77A
  area: Validation
  title: "An IBAN is checked against its country's structure (length) besides its check digits, and a creditor given by IBAN alone gets its bank's BIC from the bank code inside the IBAN"
  tests: [model:tests.AnIbanOfTheWrongLengthForItsCountryIsRefused, model:tests.AWellFormedIbanPassesTheStructureCheck,
          model:tests.TheCreditorBankIsDerivedFromTheIbanWhenNoneIsGiven, model:tests.AGivenCreditorBicIsKeptOverTheIbanOne, model:tests.AnUnknownBankCodeLeavesTheBicEmpty]

- id: UC-78A
  area: Operations
  title: "Jobs run at the times Schedule models name (cron in a time zone): closing the day, statements, account reports or a flow; once across processes; listed with next and last run and run by hand"
  tests: [java:minutesHoursDaysMonthsAndWeekdaysAreMatched, java:aMalformedExpressionNamesItsField, java:aScheduledJobRunsOnceWhenItsMinuteComesAndCanBeRunByHand]

- id: UC-79A
  area: SWIFT
  title: "A SWIFT payment goes only to banks we have a relationship with for that message type today (RMA): cover when the creditor's bank allows an MT103, serial otherwise, rejected when the correspondent would not take it; text is cut to MT field lengths with a truncation mark; outbound files carry message ids in the receiver's form"
  tests: [model:tests.ABankThatAllowsOnlyBankTransfersGetsTheCustomerTransferSerially, model:tests.ARelationshipThatEndedCountsAsNone, model:tests.TextIsCutToAnMtFieldWithATruncationMark,
          java:placeholdersAreFilledAndTheResultIsASwiftCharacterSetId]

- id: UC-81E
  area: Ledger
  title: "A fee from the schedule is booked with the debit to a fee account and returned with a reversal, the funds check covers it, a posting carries a value date and the balance by value date is reported, and a day's journal is exported as a file"
  tests: [java:aFeeIsBookedAndReturnedWithThePostingAndTheDayIsExported, model:tests.AFeeIsComputedFromASchedule, model:tests.TheSettlementAccountOfASchemeIsChosenByCurrency]

- id: UC-81D
  area: APIs
  title: "A model-defined API is also a SOAP operation: the Body's element names it, its children are the path values and the body, the answer or a Fault comes back in an envelope, and a WSDL describes every operation; the REST permission applies"
  tests: [java:theModelDefinedApisAreAlsoSoapOperations]

- id: UC-81C
  area: Data
  title: "A data set may live in a relational database: a DataSet names a table and a configured data source; rows are written, found by conditions, sorted, limited, changed and removed through SQL with parameters, and names that are not plain SQL names are refused"
  tests: [java:rowsAreWrittenFoundByConditionsChangedAndRemovedOnATable, java:namesThatAreNotPlainSqlNamesAndUnknownDataSourcesAreRefused, java:aTableDataSetNeedsItsDataSourceAndNothingElse]

- id: UC-81B
  area: Processing
  title: "A route takes amounts in a range (a clearing's limit): a payment outside it is parked for repair; a debtor account may have a daily cumulative limit besides the per-payment one, set through the same API and form; corridors are blocked or put under review by a table"
  tests: [model:tests.APaymentThatWouldTakeTheAccountOverItsDailyLimitIsRejected, model:tests.APaymentWithinTheDailyLimitGoesOn, model:tests.APaymentToABlockedDestinationIsRejected,
          model:tests.APaymentOnACorridorUnderReviewIsHeldForAPerson, java:apisDefinedByModelsStoreValidateAndAreEnforced, java:aPurposeCodeTheClearingDoesNotTakeIsRepairedAndAllSendingCanBeStoppedAtOnce]

- id: UC-81A
  area: Validation
  title: "A creditor account is identified as its country requires (IBAN, national bank code of the right form, or BIC); a bank code and a BIC are found from each other and from the IBAN; an IBAN and a bank code given together must agree; Dutch, Hungarian and UK account numbers are checked by their national rules; an IBAN is composed from its parts and taken apart"
  tests: [model:tests.ACountryThatNeedsAnIbanRefusesAPlainAccountNumber, model:tests.ABankCodeOfTheWrongFormForItsCountryIsRefused, model:tests.AnAccountWithTheCountrysBankCodePasses,
          model:tests.AnIbanAndASortCodeThatNameDifferentBanksAreRefused, model:tests.ADutchAccountFailingTheElevenTestIsRefused, model:tests.ADutchAccountPassingTheElevenTestIsAccepted,
          model:tests.TheCreditorBankIsFoundFromItsNationalCodeAndTheCodeFromItsBic, model:tests.TheNationalCodeIsFilledFromTheBic, model:tests.AnIbanIsComposedFromItsPartsAndTakenApartAgain]

- id: UC-80A
  area: Operations
  title: "A payment whose purpose code the receiving channel does not take is parked for repair; all sending is stopped and resumed at once with a second person; the day's figures show the time to route per channel; unmatched statement entries get suggested payments; bulking groups files by chosen fields"
  tests: [java:aPurposeCodeTheClearingDoesNotTakeIsRepairedAndAllSendingCanBeStoppedAtOnce, java:aPersonMatchesAStatementEntryTheEngineCouldNotAndTheDayIsReportedPerChannel]

- id: UC-80
  area: Low-code tool
  title: Models compile to code, and a mistake is reported with the model and the place
  tests: [java:workspaceBuildsAndEveryModelTestPasses, java:expressionPrecedenceAndFunctions, java:problemsNameTheModelAndThePlace,
          java:aFailingRuleExpressionBecomesAViolationNotACrash, java:forEachRunsNestedStepsPerItemAndStopsWhenTheFlowEnds, java:modelNamesAreValidated]
- id: UC-81
  area: Low-code tool
  title: A model change takes effect only after a second person approves, and then without a restart
  tests: [java:aModelChangeNeedsASecondPersonAndThenChangesBehaviour, java:aDesignerChangesARuleAndItTakesEffectOnlyAfterApproval,
          browser:a designer changes a rule in Studio]
- id: UC-82
  area: Low-code tool
  title: Flows, rule sets, decision tables and mappings are built by dragging and filling forms, without typing model text
  tests: [java:aModelWrittenFromItsDefinitionMeansTheSame, browser:a flow is built in the designer, browser:a channel is edited in a form, browser:a message specification is edited in a form,
          browser:rules are edited in a form and a decision table in a grid,
          browser:a mapping is built in the designer with a loop]
- id: UC-83
  area: Low-code tool
  title: A model is removed and an earlier deployment is restored only with a second person, and each deployment shows what it changed
  tests: [java:aModelIsRemovedAndADeploymentIsRolledBackOnlyWithApproval, browser:a deployment is rolled back]
- id: UC-84
  area: Low-code tool
  title: A message that breaks its schema or its field rules is rejected when received, and held back when the engine built it, with the failing field named
  tests: [java:anMtMessageIsCheckedFieldByFieldAgainstItsSpecification, java:aMessageSpecificationWithAMistakeIsReportedWhenTheModelsAreBuilt,
          java:aMessageThatBreaksItsSchemaOrFieldRulesIsRejectedWithTheFieldNamed, browser:a schema is imported and a message is checked,
          java:aMessageTheEngineBuildsIsCheckedBeforeItIsSentAndHeldBackWhenInvalid]

- id: UC-85
  area: Console
  title: Payments and the other records are found by search, filters, order and pages that the store works out, the same on MongoDB as in memory, and the dashboard shows where payments are
  tests: [java:aListIsSearchedFilteredSortedAndPagedByTheStore, "browser:the dashboard shows where payments are, and the list is searched, sorted and paged",
          java:theMemoryStoreAnswersTheQuestionsOfTheLists, java:mongoDbAnswersTheQuestionsOfTheListsTheSameWay,
          "browser:instructions, outbound files, approvals and the security log are searched and filtered like payments"]

- id: UC-86
  area: Console
  title: An open page is told when payments or approvals change and fetches again; the notice says what kind of thing changed and carries no data
  tests: [java:anOpenPageIsToldWhenSomethingChangesAndNothingElse, browser:the dashboard and the lists follow what happens without being reloaded]

- id: UC-87
  area: Console
  title: Every screen passes an automated accessibility check (WCAG 2.1 A and AA) and fits the window, at desktop and phone width, in the light and the dark theme
  tests: [browser:every screen passes the accessibility check and fits the window]

- id: UC-90
  area: Security
  title: Each role reaches only what its permissions allow
  tests: [java:eachRoleReachesOnlyWhatItsPermissionsAllow, browser:shows each role only its own pages]
- id: UC-94
  area: Security
  title: Roles of one's own are approved by a second person, and a user limited to channels, accounts, currencies or an amount reaches only those payments
  tests: [java:aRoleOfOnesOwnAndALimitToChannelsOrAccountsDecideWhatAUserReaches, browser:a role is created and a user is limited to one channel]
- id: UC-91
  area: Security
  title: Sign-in is protected, sessions end at sign-out, and security events are recorded
  tests: [java:headersSessionsThrottlingAndTheSecurityLog, java:passwordAndUrlPolicies, browser:the security log shows sign-ins]
- id: UC-92
  area: Security
  title: Users are created, changed and disabled through approval
  tests: [java:aUserIsCreatedChangedAndDisabledThroughApproval, java:theBootstrapPasswordCreatesTheAdministratorOnce,
          java:aShortOrMissingBootstrapPasswordCreatesNoUser]
- id: UC-93
  area: Security
  title: The server speaks HTTPS, refuses hostile input and detects tampering
  tests: [java:theServerSpeaksHttpsFromAKeystoreAndOnlyHttps, java:externalEntitiesAreRefused, java:modelTextCannotBreakOutOfTheGeneratedCode,
          java:aDeploymentChangedInTheDatabaseIsNotRun]
