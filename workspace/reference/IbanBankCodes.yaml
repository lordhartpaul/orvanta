kind: ReferenceTable
name: reference.IbanBankCodes
description: >
  The BIC of a bank by the bank identifier inside its IBANs: key "<country>|<bank code>" as ibanProblem()
  and bicFromIban() cut it out with reference.IbanStructures. When a customer gives a creditor IBAN and no
  BIC, enrichment fills the creditor's bank from here, so SEPA reachability and routing can go on.
  Sample data for a few banks: load the bank's IBAN Plus directory into this table (Rows tab, CSV).
