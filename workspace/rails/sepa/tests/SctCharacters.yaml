kind: TestCase
name: tests.SepaNameOutsideTheCharacterSetIsRejected
description: "A creditor name with accented letters and an ampersand is outside the SEPA character set."
target: payments.flows.TransactionProcessing
clock: "2026-10-05T08:00:00Z"
given:
  txn:
    id: ORVTXN0000000008
    endToEndId: SEPA-T1
    amount: 1250
    currency: EUR
    requestedDate: "2026-10-05"
    chargeBearer: SLEV
    debtor: {name: "Rheinland Pumpen GmbH", account: "DE89370400440532013000", agentBic: DEUTDEFF}
    creditor: {name: "Señor Müller & Søn", account: "FR1420041010050500013M02606", agentBic: BNPAFRPP}
mocks:
  connectors.AccountLookup: {status: ACTIVE, currency: EUR}
expect:
  - result.status == 'REJECTED'
  - result.code == 'CH16'
  - toSepaText(txn.creditor.name) == 'Senor Muller . Son'
