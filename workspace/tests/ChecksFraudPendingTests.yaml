kind: TestCase
name: tests.PendingFraudResultWaits
description: When the fraud system answers later, the payment waits and nothing is posted.
target: payments.flows.TransactionProcessing
given:
  txn:
    id: ORVTXN0000000007
    endToEndId: CHK-1
    amount: 250
    currency: ZAR
    debtor: {name: "Karoo Mining Supplies", account: "4051122334"}
    creditor: {name: "Thandiwe Mokoena", account: "62011223344", agentBic: FIRNZAJJ}
mocks:
  connectors.FraudCheck: {status: PENDING}
expect:
  - result.status == 'WAIT'
  - result.code == 'FRAUD'
  - not exists(txn.posting)
