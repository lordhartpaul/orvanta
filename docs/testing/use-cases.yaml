# The use-case catalogue: what the platform must do, and the automated tests that prove each point.
# bin/test-report.py reads this file together with the test results and fails when a use case has
# a failing test, a test that did not run, or names a test that does not exist.
#
# A test is named by its kind and its name:
#   java:<method>      a JUnit test method (the names are unique across the classes)
#   model:<name>       a TestCase model of the workspace
#   browser:<text>     a browser test whose title contains the text

- id: UC-01
  area: Receiving
  title: A credit transfer file is received, debulked and every payment followed to its outcome
  tests: [java:isoInstructionRunsThroughEveryStageToItsFinalStatus, java:anOperatorSubmitsAFileAndFollowsEveryPaymentToItsOutcome,
          model:tests.Pain001IsDebulked, browser:an operator submits a file]
- id: UC-02
