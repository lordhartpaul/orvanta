kind: Flow
name: api.flows.MandateRead
steps:
  - id: lookup
    type: find
    dataset: data.Mandates
    where:
      mandateId: request.path.mandateId
    first: true
    into: response

  - id: none
    type: end
    when: not exists(response)
    status: NOT_FOUND
    code: NOT_FOUND
    message: No mandate is registered under this reference
