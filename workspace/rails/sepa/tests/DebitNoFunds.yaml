kind: TestCase
name: tests.IncomingCollectionWithoutFundsGoesBack
description: "The account system refuses the debit: sent back with AM04."
target: rails.sepa.flows.IncomingDebitProcessing
given:
  txn:
    id: ORVTXN0000000950
    paymentType: DD_IN
    channelIn: rails.sepa.SddDebtorInbound
    endToEndId: POWER-OCT
    originalTxId: SNDDD-1
    originalMsgId: SND-DD-MSG-1
    originalMessageType: pacs.003.001.08
    amount: 84.20
    currency: EUR
    sequenceType: RCUR
    mandate: {id: MND-7001, signedOn: "2025-03-01"}
    creditor: {name: "Nordlicht Energie GmbH", account: "DE89370400440532013000", agentBic: COBADEFF, schemeId: DE98ZZZ09999999999}
    debtor: {name: "Lukas Schmidt", account: "DE08500105175400000042"}
mocks:
  connectors.AccountLookup: {status: ACTIVE, currency: EUR}
  connectors.AccountPosting: {status: REFUSED, reason: INSUFFICIENT_FUNDS}
expect:
  - result.status == 'REJECTED'
  - result.code == 'AM04'
