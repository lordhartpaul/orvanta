kind: MessageSpec
name: specs.swift.MT940
description: >
  Field rules of the MT940 customer statement.
  Formats are in SWIFT format notation. Written from the published field formats, not copied from a
  standards release: compare with the release your bank is on before relying on it.
format: swift.mt
messageType: MT940
sequences:
  - id: header
    fields:
      - {tag: "20", name: transaction reference, required: true, format: "16x"}
      - {tag: "21", name: related reference, format: "16x"}
      - {tag: "25", name: account identification, required: true, options: {"": "35x", P: ["35x", "4!a2!a2!c[3!c]"]}}
      - {tag: "28C", name: statement and sequence number, required: true, format: "5n[/5n]"}
      - {tag: "60", name: opening balance, required: true, options: {F: "1!a6!n3!a15d", M: "1!a6!n3!a15d"}, is: date}
  - id: line
    required: false
    repeat: true
    fields:
      - {tag: "61", name: statement line, required: true, format: ["6!n[4!n]2a[1!a]15d1!a3!c16x[//16x]", "[34x]"], is: date}
      - {tag: "86", name: information to account owner, format: "6*65x"}
  - id: trailer
    fields:
      - {tag: "62", name: closing balance, required: true, options: {F: "1!a6!n3!a15d", M: "1!a6!n3!a15d"}, is: date}
      - {tag: "64", name: closing available balance, format: "1!a6!n3!a15d", is: date}
      - {tag: "65", name: forward available balance, repeat: true, format: "1!a6!n3!a15d", is: date}
      - {tag: "86", name: information to account owner, format: "6*65x"}
