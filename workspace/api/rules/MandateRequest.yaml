kind: RuleSet
name: api.rules.MandateRequest
description: What a mandate must state.
rules:
  - id: REFERENCE
    assert: matches(request.path.mandateId, '[A-Za-z0-9+?/:().,-]{1,35}')
    code: MD02
    message: The mandate reference must be 1 to 35 characters of the SEPA character set, without spaces
  - id: CREDITOR_IDENTIFIER
    assert: matches(request.body.creditorId, '[A-Z]{2}[0-9]{2}[A-Z0-9]{3}[A-Z0-9]{1,28}')
    code: BE16
    message: creditorId is missing or malformed
  - id: DEBTOR_ACCOUNT
    assert: isIban(request.body.debtorAccount)
    code: AC02
    message: debtorAccount must be a valid IBAN
  - id: DEBTOR_NAME
    assert: exists(request.body.debtorName) and len(request.body.debtorName) <= 70
    code: BE22
    message: debtorName is required, at most 70 characters
  - id: SIGNATURE_DATE
    assert: isDate(request.body.signedOn) and request.body.signedOn <= today()
    code: MD02
    message: signedOn must be the date the debtor signed, not in the future
  - id: TYPE
    assert: request.body.type in ['RCUR', 'OOFF']
    code: AG02
    message: type must be RCUR or OOFF
