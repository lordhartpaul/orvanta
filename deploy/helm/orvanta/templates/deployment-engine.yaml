apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orvanta.fullname" . }}-engine
  labels:
    {{- include "orvanta.labels" . | nindent 4 }}
    app.kubernetes.io/component: engine
spec:
  replicas: {{ .Values.engine.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "orvanta.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: engine
  template:
    metadata:
      labels:
        {{- include "orvanta.labels" . | nindent 8 }}
        app.kubernetes.io/component: engine
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: orvanta
          image: {{ include "orvanta.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - {name: ORVANTA_UNITS, value: {{ .Values.engine.units | quote }}}
            - {name: ORVANTA_HEALTH_PORT, value: {{ .Values.engine.healthPort | quote }}}
          {{- include "orvanta.envFrom" . | nindent 10 }}
          ports:
            - {name: health, containerPort: {{ .Values.engine.healthPort }}}
          readinessProbe:
            httpGet: {path: /health, port: health}
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: health}
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- toYaml .Values.engine.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            {{- include "orvanta.volumeMounts" . | nindent 12 }}
      volumes:
        {{- include "orvanta.volumes" . | nindent 8 }}
