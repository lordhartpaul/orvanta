kind: Flow
name: payments.flows.FrozenReversal
description: >
  Takes the funds of a payment held on a sanctions hit off the seized-funds account again, when a person
  decided that the payment goes back. Run by the engine before the payment is sent back.
steps:
  - id: reverse
    type: call
    connector: connectors.PostingReversal
    request:
      idempotencyKey: concat(txn.id, '-UNFREEZE')
      reference: txn.id
      postingId: txn.frozen.postingId
      reason: "'Returned after review'"
    into: txn.frozen.reversal
    onError: reject
