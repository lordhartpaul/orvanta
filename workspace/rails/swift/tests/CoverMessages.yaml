kind: TestCase
name: tests.SwiftCoverBuildsTwoMessages
description: "Cover method: an MT103 to the creditor bank naming the reimbursement bank, and an MT202 COV to the correspondent."
target: payments.outbound.CanonicalToMt103
given:
  bulk: {msgId: ORVOUT0000000012, senderBic: ORVAZAJJ}
  txns:
    - id: ORVTXN0000000009
      endToEndId: XB-1
      amount: 5000
      currency: USD
      valueDate: "2026-10-05"
      uetr: 3f0c0a2e-0b7e-4b53-9d55-5f4f0f6f2b11
      chargeBearer: SHAR
      debtor: {name: "Karoo Mining Supplies", account: "4051122334"}
      creditor: {name: "Overseas Supplier Inc", account: "000987654321", agentBic: CITIUS33}
      remittance: Invoice 4471
      route: {settlementMethod: COVER, correspondentBic: CHASUS33}
expect:
  - count(result.messages) == 2
  - result.messages[0].type == '103'
  - result.messages[0].receiver == 'CITIUS33'
  - mtField(result.messages[0], '53A') == 'CHASUS33'
  - not exists(mtField(result.messages[0], '57A'))
  - result.messages[1].type == '202'
  - result.messages[1].receiver == 'CHASUS33'
  - result.messages[1].b3.119 == 'COV'
  - result.messages[1].b3.121 == result.messages[0].b3.121
  - mtField(result.messages[1], '20') == 'CRVTXN0000000009'
  - mtField(result.messages[1], '21') == 'ORVTXN0000000009'
  - mtField(result.messages[1], '58A') == 'CITIUS33'
  - mtField(result.messages[1], '32A') == mtField(result.messages[0], '32A')
  - mtAccount(mtField(result.messages[1], '59')) == '000987654321'
  - len(mtField(result.messages[1], '20')) == 16
