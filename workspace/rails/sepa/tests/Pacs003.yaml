kind: TestCase
name: tests.DirectDebitMessageIsBuilt
description: The pacs.003 carries the mandate, the creditor identifier, the sequence type and the collection date.
target: rails.sepa.maps.CanonicalToSepaPacs003
given:
  bulk: {msgId: ORVOUT0000000013, createdAt: "2026-10-06T08:00:00Z", count: 1, total: 49.90, senderBic: ORVADEFF}
  txns:
    - id: ORVTXN0000000010
      endToEndId: DD-T1
      amount: 49.90
      sequenceType: RCUR
      collectionDate: "2026-10-07"
      creditor: {name: "Nordlicht Energie GmbH", account: "DE89370400440532013000", agentBic: ORVADEFF, schemeId: DE98ZZZ09999999999}
      debtor: {name: "Camille Laurent", account: "FR1420041010050500013M02606", agentBic: BNPAFRPP}
      mandate: {id: MND-1001, signedOn: "2026-01-15"}
expect:
  - result.Document.@xmlns == 'urn:iso:std:iso:20022:tech:xsd:pacs.003.001.08'
  - result.Document.FIToFICstmrDrctDbt.GrpHdr.PmtTpInf.LclInstrm.Cd == 'CORE'
  - result.Document.FIToFICstmrDrctDbt.DrctDbtTxInf[0].PmtTpInf.SeqTp == 'RCUR'
  - result.Document.FIToFICstmrDrctDbt.DrctDbtTxInf[0].ReqdColltnDt == '2026-10-07'
  - result.Document.FIToFICstmrDrctDbt.DrctDbtTxInf[0].DrctDbtTx.MndtRltdInf.MndtId == 'MND-1001'
  - result.Document.FIToFICstmrDrctDbt.DrctDbtTxInf[0].DrctDbtTx.CdtrSchmeId.Id.PrvtId.Othr.Id == 'DE98ZZZ09999999999'
  - result.Document.FIToFICstmrDrctDbt.DrctDbtTxInf[0].DbtrAcct.Id.IBAN == 'FR1420041010050500013M02606'
