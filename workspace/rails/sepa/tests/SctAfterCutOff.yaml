kind: TestCase
name: tests.SepaAfterCutOffWaitsForTheNextOpening
description: "At 16:30 in Berlin the 15:00 cut-off has passed: kept until 07:00 the next business day."
target: payments.flows.TransactionProcessing
clock: "2026-10-05T14:30:00Z"
given:
  txn:
    id: ORVTXN0000000008
    endToEndId: SEPA-T1
    amount: 1250
    currency: EUR
    requestedDate: "2026-10-05"
    chargeBearer: SLEV
    debtor: {name: "Rheinland Pumpen GmbH", account: "DE89370400440532013000", agentBic: DEUTDEFF}
    creditor: {name: "Atelier Lumiere SARL", account: "FR1420041010050500013M02606", agentBic: BNPAFRPP}
mocks:
  connectors.AccountLookup: {status: ACTIVE, currency: EUR}
expect:
  - result.status == 'WAREHOUSE'
  - result.code == 'CUTOFF'
  - txn.warehouse.until == '2026-10-06T05:00:00Z'
  - not exists(txn.posting)
