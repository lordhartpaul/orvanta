kind: ReferenceTable
name: reference.IbanStructures
description: >
  How an IBAN of each country is built: its total length and where the bank identifier sits (1-based position
  and length within the IBAN). Read by ibanProblem() to refuse an IBAN of the wrong length for its country,
  and by bicFromIban() to find the bank code that reference.IbanBankCodes maps to a BIC. Written from the
  commonly published IBAN registry lengths, not from the registry file itself: compare with the current
  SWIFT IBAN Registry before relying on it, and add the countries you pay to.
key: country
