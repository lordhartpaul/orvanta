kind: TestCase
name: tests.ABankThatAllowsOnlyBankTransfersGetsTheCustomerTransferSerially
description: "A relationship for MT202 alone is no relationship for an MT103: the payment goes serial through the correspondent."
target: payments.flows.TransactionProcessing
given:
  txn:
    id: ORVTXN0000000094
    endToEndId: XB-RMA-1
    amount: 5000
    currency: USD
    valueDate: "2026-10-05"
    uetr: 3f0c0a2e-0b7e-4b53-9d55-5f4f0f6f2b94
    debtor: {name: "Karoo Mining Supplies", account: "4051122334"}
    creditor: {name: "Overseas Supplier Inc", account: "000987654321", agentBic: BOFAUS3N}
mocks:
  connectors.FxRates: {rate: 18.50}
expect:
  - result.status == 'ROUTED'
  - txn.route.settlementMethod == 'SERIAL'
  - txn.route.correspondentBic == 'CHASUS33'
