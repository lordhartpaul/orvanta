  - result.Document.RsltnOfInvstgtn.RslvdCase.Id == 'CASE-7781'
  - result.Document.RsltnOfInvstgtn.Sts.Conf == 'RJCR'
  - result.Document.RsltnOfInvstgtn.CxlDtls.TxInfAndSts.OrgnlTxId == 'SNDTX-1'
  - result.Document.RsltnOfInvstgtn.CxlDtls.TxInfAndSts.OrgnlEndToEndId == 'RENT-OCT'
  - result.Document.RsltnOfInvstgtn.CxlDtls.TxInfAndSts.TxCxlSts == 'RJCR'
  - result.Document.RsltnOfInvstgtn.CxlDtls.TxInfAndSts.CxlStsRsnInf.Rsn.Cd == 'CUST'
