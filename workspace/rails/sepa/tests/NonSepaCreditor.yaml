kind: TestCase
name: tests.EuroToANonSepaAccountGoesBySwift
description: "Euro to an account outside the SEPA area is not a SEPA payment; it is converted from nothing and sent by SWIFT."
target: payments.flows.TransactionProcessing
clock: "2026-10-05T08:00:00Z"
given:
  txn:
    id: ORVTXN0000000008
    endToEndId: SEPA-T1
    amount: 1250
    currency: EUR
    requestedDate: "2026-10-05"
    chargeBearer: SLEV
    debtor: {name: "Rheinland Pumpen GmbH", account: "DE89370400440532013000", agentBic: DEUTDEFF}
    creditor: {name: "Atelier Lumiere SARL", account: "000123456789", agentBic: BNPAFRPP}
mocks:
  connectors.AccountLookup: {status: ACTIVE, currency: EUR}
expect:
  - result.status == 'ROUTED'
  - txn.route.scheme == 'SWIFT'
  - not exists(txn.rail)
