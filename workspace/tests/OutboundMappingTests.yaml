kind: TestCase
name: tests.Pacs008IsBuilt
description: Two routed transactions become one pacs.008 with a correct header and both transactions.
target: payments.outbound.CanonicalToPacs008
given:
  bulk: {msgId: ORVOUT0000000001, createdAt: "2026-10-04T10:00:00Z", count: 2, total: 39550.50, currency: ZAR, senderBic: ORVAZAJJ}
  txns:
    - id: ORVTXN0000000001
      endToEndId: SAL-0001
      amount: 18250.00
      currency: ZAR
      chargeBearer: SLEV
      uetr: 3f0c0a2e-0b7e-4b53-9d55-5f4f0f6f2b11
      debtor: {name: "Karoo Mining Supplies", account: "4051122334", agentBic: ORVAZAJJ}
      creditor: {name: "Thandiwe Mokoena", account: "62011223344", agentBic: FIRNZAJJ}
      remittance: Salary October 2026
    - id: ORVTXN0000000002
      endToEndId: SAL-0002
      amount: 21300.50
      currency: ZAR
      chargeBearer: SLEV
      debtor: {name: "Karoo Mining Supplies", account: "4051122334", agentBic: ORVAZAJJ}
      creditor: {name: "Pieter van der Merwe", account: "DE89370400440532013000", agentBic: ABSAZAJJ}
expect:
  - result.Document.@xmlns == 'urn:iso:std:iso:20022:tech:xsd:pacs.008.001.08'
  - result.Document.FIToFICstmrCdtTrf.GrpHdr.MsgId == 'ORVOUT0000000001'
  - result.Document.FIToFICstmrCdtTrf.GrpHdr.NbOfTxs == '2'
  - result.Document.FIToFICstmrCdtTrf.GrpHdr.TtlIntrBkSttlmAmt.@Ccy == 'ZAR'
  - num(result.Document.FIToFICstmrCdtTrf.GrpHdr.TtlIntrBkSttlmAmt) == 39550.50
  - count(result.Document.FIToFICstmrCdtTrf.CdtTrfTxInf) == 2
  - result.Document.FIToFICstmrCdtTrf.CdtTrfTxInf[0].PmtId.TxId == 'ORVTXN0000000001'
  - result.Document.FIToFICstmrCdtTrf.CdtTrfTxInf[0].CdtrAcct.Id.Othr.Id == '62011223344'
  - result.Document.FIToFICstmrCdtTrf.CdtTrfTxInf[1].CdtrAcct.Id.IBAN == 'DE89370400440532013000'
  - not exists(result.Document.FIToFICstmrCdtTrf.CdtTrfTxInf[1].RmtInf)
