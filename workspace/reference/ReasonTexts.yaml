kind: ReferenceTable
name: reference.ReasonTexts
description: >
  What a reason code means, in the languages the bank's customers read. Looked up with
  text(code, language): the text in that language, or else in English, or else the code itself. The
  codes are ISO 20022 external status reason codes and the platform's own; the wording is the bank's
  to change. Sample texts: add the languages and codes you need.
key: id
