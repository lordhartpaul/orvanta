kind: TestCase
name: tests.InstantAnswerIsAcceptedOrRejectedWithTheReason
description: "The pacs.002 that answers instant payments: ACCP with the time of the credit, RJCT with the reason."
target: rails.sepa.maps.CanonicalToInstStatus
given:
  bulk: {msgId: ORVOUT0000000110, createdAt: "2026-10-06T21:14:04Z", senderBic: ORVADEFF, count: 2}
  txns:
    - {status: CREDITED, id: ORVTXN0000000995, endToEndId: DINNER-SPLIT, originalTxId: INSTTX-1, originalMsgId: INST-IN-1, creditedAt: "2026-10-06T21:14:03.900Z"}
    - id: ORVTXN0000000996
      endToEndId: RENT-NOW
      originalTxId: INSTTX-2
      originalMsgId: INST-IN-2
      return: {reasonCode: AC04, reasonText: Creditor account is closed, requestedBy: application}
expect:
  - result.Document.FIToFIPmtStsRpt.TxInfAndSts[0].TxSts == 'ACCP'
  - result.Document.FIToFIPmtStsRpt.TxInfAndSts[0].OrgnlTxId == 'INSTTX-1'
  - result.Document.FIToFIPmtStsRpt.TxInfAndSts[0].AccptncDtTm == '2026-10-06T21:14:03.900Z'
  - not exists(result.Document.FIToFIPmtStsRpt.TxInfAndSts[0].StsRsnInf)
  - result.Document.FIToFIPmtStsRpt.TxInfAndSts[1].TxSts == 'RJCT'
  - result.Document.FIToFIPmtStsRpt.TxInfAndSts[1].StsRsnInf.Rsn.Cd == 'AC04'
  - result.Document.FIToFIPmtStsRpt.TxInfAndSts[1].OrgnlGrpInf.OrgnlMsgId == 'INST-IN-2'
